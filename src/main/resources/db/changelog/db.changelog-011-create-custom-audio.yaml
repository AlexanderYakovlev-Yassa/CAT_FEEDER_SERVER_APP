databaseChangeLog:
  - changeSet:
      id: 011-create-custom-audio
      author: alex
      changes:
        - createTable:
            tableName: custom_audio
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: audio_data
                  type: BYTEA
                  constraints:
                    nullable: false
              - column:
                  name: duration_seconds
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
